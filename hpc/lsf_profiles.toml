# LSF submission profiles: cluster hardware + queue limits only.
#
# `wall_time` is the per-slot scheduler ceiling (the queue maximum for one job),
# NOT the length of a training campaign. To train for longer than one slot, pass
# `invoke hpc.submit --duration <e.g. 2w>`: each slot runs up to `wall_time`,
# checkpoints, and resubmits until the duration is spent or training finishes.
# `max_resubmits` is the hard ceiling on those automatic resubmissions so a
# stuck run can never resubmit forever.

[h100]
queue = "gpuh100"
wall_time = "24:00"
cores = 17
memory = "12GB"
gpu = "num=1:mode=exclusive_process"
email = "s234805@dtu.dk"
job_name_prefix = "codllm"
storage_folder = "$BLACKHOLE"
modules = ["cuda/12.2"]
max_resubmits = 30

[v100]
queue = "gpuv100"
wall_time = "10:00"
cores = 4
memory = "6GB"
gpu = "num=1:mode=exclusive_process"
email = "s234805@dtu.dk"
job_name_prefix = "codllm"
storage_folder = "$BLACKHOLE"
modules = ["cuda/12.2"]
extra_resources = ["select[gpu32gb]"]
max_resubmits = 30
