name = "publication_v1_reduced_calibration"
command = "train"
description = "Whole-cohort 25%/40% calibration: evaluation populations differ; seeds reuse the matching fixed cohort."
force_reprocess = false

[env]
CODLLM_PUBLICATION_GATE = "recipe"

[[variants]]
name = "winner-0.25"
base = "candidate_winner.toml"
[variants.env]
CODLLM_DATASET_SIZE = 0.25
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/reduced-calibration/winner/0.25"

[[variants]]
name = "winner-0.4"
base = "candidate_winner.toml"
[variants.env]
CODLLM_DATASET_SIZE = 0.4
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/reduced-calibration/winner/0.4"

[[variants]]
name = "runner_up-0.25"
base = "candidate_runner_up.toml"
[variants.env]
CODLLM_DATASET_SIZE = 0.25
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/reduced-calibration/runner_up/0.25"

[[variants]]
name = "runner_up-0.4"
base = "candidate_runner_up.toml"
[variants.env]
CODLLM_DATASET_SIZE = 0.4
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/reduced-calibration/runner_up/0.4"
