name = "publication_reduced_split_sensitivity"
command = "train"
description = "Paired winner/runner-up split and preparation sensitivity on one fixed 25 percent cohort."
force_reprocess = false

[env]
CODLLM_DATASET_SIZE = 0.25
CODLLM_DATASET_SAMPLE_SEED = 777
CODLLM_SEED = 777

[[variants]]
name = "winner_data-seed-101"
base = "candidate_winner.toml"
[variants.env]
CODLLM_DATA_SEED = 101
CODLLM_OUTPUT_DIR = "checkpoints/publication/reduced-split/winner/data-seed-101"

[[variants]]
name = "runner-up_data-seed-101"
base = "candidate_runner_up.toml"
[variants.env]
CODLLM_DATA_SEED = 101
CODLLM_OUTPUT_DIR = "checkpoints/publication/reduced-split/runner-up/data-seed-101"

