name: publication-joint-bayesian-v1
method: bayes
run_cap: 60

metric:
  name: optimization/val_macro_f1
  goal: maximize

parameters:
  balance_floor:
    distribution: q_uniform
    min: 100
    max: 900
    q: 50
  multicod_synthetic_ratio:
    distribution: q_uniform
    min: 0.10
    max: 0.90
    q: 0.05
  pretrain_epochs:
    values: [0, 4, 8, 16, 32, 48]
  pretrain_synthetic_ratio:
    distribution: q_uniform
    min: 0.0
    max: 0.50
    q: 0.05
  pretrain_target_per_label:
    values: [8, 12, 16]
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.00005
  scheduler:
    values: [cosine, constant]
  warmup_ratio:
    distribution: q_uniform
    min: 0.05
    max: 0.30
    q: 0.05
  base_perturbation_rate:
    values: [0.0, 0.25, 0.50]

program: tools/run_publication_bayes.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --base-config
  - runs/publication/bayesian_base.toml
  - --parameters-json
  - ${args_json_file}
