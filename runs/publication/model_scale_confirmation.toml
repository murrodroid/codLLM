name = "publication_v1_scale_large"
command = "train"
description = "Publication v1 experiment."
force_reprocess = false

[env]
CODLLM_DETERMINISTIC_ALGORITHMS = true
CODLLM_CUDNN_DETERMINISTIC = true
CODLLM_CUDNN_BENCHMARK = false
CODLLM_GRADIENT_ACCUMULATION_STEPS = 2
CODLLM_PUBLICATION_GATE = "recipe"

[[variants]]
name = "winner"
base = ["candidate_winner.toml","../profiles/h100-large.toml"]
[variants.env]
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/scale/large/winner"

[[variants]]
name = "runner_up"
base = ["candidate_runner_up.toml","../profiles/h100-large.toml"]
[variants.env]
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/scale/large/runner_up"
