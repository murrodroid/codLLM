name = "publication_v1_baselines_copenhagen"
command = "publication-baseline"
description = "Lookup, character-linear, and masterlist-retrieval comparisons on one fixed partition."

[env]
CODLLM_HOLD_OUT_DATASET = "copenhagen_may2025"

[[variants]]
name = "lookup"
base = "baseline_protocol.toml"
[variants.env]
CODLLM_PUBLICATION_BASELINE = "lookup"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/baselines/copenhagen/lookup"

[[variants]]
name = "linear"
base = "baseline_protocol.toml"
[variants.env]
CODLLM_PUBLICATION_BASELINE = "linear"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/baselines/copenhagen/linear"

[[variants]]
name = "retrieval"
base = "baseline_protocol.toml"
[variants.env]
CODLLM_PUBLICATION_BASELINE = "retrieval"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/baselines/copenhagen/retrieval"
