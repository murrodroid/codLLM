name = "publication_v1_interaction_confirmation"
command = "train"
description = "Eight full-fidelity grouped-COD cells: floor 0/450, synthesis .30/.60, pretraining 4/48."
force_reprocess = false

[env]

[[variants]]
name = "floor-0_synthetic-0.3_pretrain-4"
base = "protocol_v1.toml"
[variants.env]
CODLLM_BALANCE_FLOOR = 0
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0.3
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 4
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/screen/floor-0_synthetic-0.3_pretrain-4"

