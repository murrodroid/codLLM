name = "publication_base"
command = "train"
description = """
Frozen base-model protocol for publication response curves. Curve specifications
inherit this file and override only their declared response variable plus an
isolated output root.
"""
base = "../profiles/h100-base.toml"
force_reprocess = false

[env]
CODLLM_OUTPUT_DIR = "checkpoints/publication/baseline"
CODLLM_AUTO_RESUME = true
CODLLM_RUNTIME_SAFETY_MARGIN_SECONDS = 600

CODLLM_SEED = 777
CODLLM_DATA_SEED = 777
CODLLM_DETERMINISTIC_ALGORITHMS = true
CODLLM_DETERMINISTIC_ALGORITHMS_WARN_ONLY = true
CODLLM_CUDNN_DETERMINISTIC = true
CODLLM_CUDNN_BENCHMARK = false

CODLLM_WANDB_LOG_MODEL = "false"
CODLLM_WANDB_MODE = "online"
CODLLM_WANDB_METRIC_MODE = "all"
CODLLM_WANDB_RUN_CONFIG_MODE = "full"

CODLLM_TRAINING_INPUT = "cod,age,sex"
CODLLM_DATASET_SIZE = 1.0
CODLLM_TRAIN_SIZE = 0.9
CODLLM_VAL_SIZE = 0.05
CODLLM_TEST_SIZE = 0.05

CODLLM_LR = 2.5e-5
CODLLM_WEIGHT_DECAY = 0.0
CODLLM_MAX_GRAD_NORM = 0.5
CODLLM_WARMUP_RATIO = 0.1
CODLLM_LR_SCHEDULER_TYPE = "cosine"
CODLLM_NUM_TRAIN_EPOCHS = 120
CODLLM_EVAL_STRATEGY = "epoch"
CODLLM_SAVE_STRATEGY = "best"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"
CODLLM_SAVE_TOTAL_LIMIT = 1
CODLLM_LOAD_BEST_MODEL_AT_END = true
CODLLM_EARLY_STOPPING_PATIENCE = 10
CODLLM_EARLY_STOPPING_THRESHOLD = 0.0

# Tuning uses validation only. The test split remains constructed and locked.
CODLLM_FINAL_TEST_EVAL_ENABLED = false
CODLLM_UNCERTAINTY_EVAL = false

CODLLM_LABEL_HARMONIZATION_ENABLED = true
CODLLM_LABEL_STANDARDIZATION_ENABLED = true
CODLLM_MAX_LABEL_COUNT = 5

CODLLM_MULTICOD_SHUFFLE_LABELS = true
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0.5
CODLLM_MULTICOD_SYNTHETIC_SOURCE_SCOPE = "within_source"
CODLLM_MULTICOD_SYNTHETIC_TEXT_SEPARATORS = '[", ", " & ", " ", "; ", " / "]'

CODLLM_BALANCE_STRATEGY = "floor"
CODLLM_BALANCE_FLOOR = 300
CODLLM_BALANCE_FLOOR_DECAY = 0.0
CODLLM_BALANCE_FLOOR_SINGLECOD_ONLY = true
CODLLM_BALANCE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_BALANCE_PERTURBATION_MEAN = 0.05
CODLLM_BALANCE_PERTURBATION_VARIANCE = 0.0
CODLLM_BALANCE_PERTURBATION_LOFT = 3.0

CODLLM_BASE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_BASE_PERTURBATION_RATE = 0.5
CODLLM_BASE_PERTURBATION_MEAN = 0.10
CODLLM_BASE_PERTURBATION_VARIANCE = 0.05
CODLLM_BASE_PERTURBATION_LOFT = 3.0

CODLLM_PRETRAIN_ENABLED = true
CODLLM_PRETRAIN_LEARNING_RATE = 1e-5
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 32
CODLLM_PRETRAIN_WARMUP_RATIO = 0.5
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "constant"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 4
CODLLM_PRETRAIN_EARLY_STOPPING_PATIENCE = 0
CODLLM_PRETRAIN_LOAD_BEST_MODEL_AT_END = false
CODLLM_PRETRAIN_UPSAMPLE_ENABLED = true
CODLLM_PRETRAIN_UPSAMPLE_TARGET_PER_LABEL = 12
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS_PER_SAMPLE = 3
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_RATIO = 0.30
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_TEXT_SEPARATORS = '[", ", " & ", " ", "; ", " / "]'

CODLLM_MASTERLIST_INJECT_ENABLED = false
