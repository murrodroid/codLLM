name = "publication_v1_source_comparison_remaining"
command = "train"
description = "Phase 2b: unchanged plain/selected recipes on Amsterdam, Madrid, and Ipswich; six fresh runs."
force_reprocess = false

[env]
CODLLM_PUBLICATION_GATE = "source_pair"

[[variants]]
name = "selected-amsterdam"
base = "source_comparison_selected.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "amsterdam_1854_1926"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/selected/amsterdam"

[[variants]]
name = "plain-amsterdam"
base = "source_comparison_plain.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "amsterdam_1854_1926"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/plain/amsterdam"

[[variants]]
name = "selected-madrid"
base = "source_comparison_selected.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "madrid_1905_1927"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/selected/madrid"

[[variants]]
name = "plain-madrid"
base = "source_comparison_plain.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "madrid_1905_1927"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/plain/madrid"

[[variants]]
name = "selected-ipswich"
base = "source_comparison_selected.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "ipswich_1871_1911"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/selected/ipswich"

[[variants]]
name = "plain-ipswich"
base = "source_comparison_plain.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "ipswich_1871_1911"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/plain/ipswich"
