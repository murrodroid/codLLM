name = "publication_v1_source_remaining"
command = "train"
description = "Complete the matched five-archive panel; combines with four pilot runs."
force_reprocess = false

[env]
CODLLM_PUBLICATION_GATE = "source_pair"

[[variants]]
name = "winner-amsterdam"
base = "candidate_winner.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "amsterdam_1854_1926"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source/winner/amsterdam"

[[variants]]
name = "runner_up-amsterdam"
base = "candidate_runner_up.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "amsterdam_1854_1926"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source/runner_up/amsterdam"

[[variants]]
name = "winner-madrid"
base = "candidate_winner.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "madrid_1905_1927"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source/winner/madrid"

[[variants]]
name = "runner_up-madrid"
base = "candidate_runner_up.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "madrid_1905_1927"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source/runner_up/madrid"

[[variants]]
name = "winner-ipswich"
base = "candidate_winner.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "ipswich_1871_1911"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source/winner/ipswich"

[[variants]]
name = "runner_up-ipswich"
base = "candidate_runner_up.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "ipswich_1871_1911"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source/runner_up/ipswich"
