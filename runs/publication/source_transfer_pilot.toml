name = "publication_v1_source_comparison_pilot"
command = "train"
description = "Phase 2a: plain versus selected training on Copenhagen and Belgium; source_pair review required."
force_reprocess = false

[env]
CODLLM_PUBLICATION_GATE = "source_pair"

[[variants]]
name = "selected-copenhagen"
base = "source_comparison_selected.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "copenhagen_may2025"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/selected/copenhagen"

[[variants]]
name = "plain-copenhagen"
base = "source_comparison_plain.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "copenhagen_may2025"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/plain/copenhagen"

[[variants]]
name = "selected-belgium"
base = "source_comparison_selected.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "belgium_1920_1930"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/selected/belgium"

[[variants]]
name = "plain-belgium"
base = "source_comparison_plain.toml"
[variants.env]
CODLLM_HOLD_OUT_DATASET = "belgium_1920_1930"
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/source-comparison/plain/belgium"
