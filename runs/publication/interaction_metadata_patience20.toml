name = "publication_v1_interaction_metadata_patience20"
command = "train"
base = "protocol_v1.toml"
description = """
Explicit continuation of all eight COD+age+sex interaction cells: patience 20, original
120-epoch ceiling and LR schedule. New output roots and W&B identities;
completed parents required.
"""
force_reprocess = false

[env]
CODLLM_TRAINING_INPUT = "cod,age,sex"
CODLLM_PROCESSED_FILENAME = "publication-v1-metadata.parquet"
CODLLM_EARLY_STOPPING_PATIENCE = 20
CODLLM_NUM_TRAIN_EPOCHS = 120
CODLLM_CONTINUATION_LR_SCHEDULE = "original"
CODLLM_AUTO_RESUME = true
CODLLM_FINAL_TEST_EVAL_ENABLED = false
WANDB_RUN_GROUP = "publication_v1_interaction_metadata_patience20"

[[variants]]
name = "floor-0_synthetic-0.3_pretrain-4"
[variants.env]
CODLLM_BALANCE_FLOOR = 0
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0.3
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 4
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/interaction-metadata-patience20/floor-0_synthetic-0.3_pretrain-4/run-0001"
