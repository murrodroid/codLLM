name = "publication_v1_final_model"
command = "train"
description = "Optional independently identified final training/refit; prefer evaluating an existing frozen checkpoint when suitable."
base = "candidate_winner.toml"
force_reprocess = false

[env]
CODLLM_PUBLICATION_GATE = "final"
CODLLM_FINAL_TEST_EVAL_ENABLED = true
CODLLM_UNCERTAINTY_EVAL = true
CODLLM_OUTPUT_DIR = "checkpoints/publication-v1/final"
