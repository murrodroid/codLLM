name = "thesis_base"
command = "train"
description = """
Shared baseline for the thesis ablation suite. The model is flan-t5-base (the
~250M-parameter model a demographer would realistically run; see the Experiments
chapter's experimental-design section), carried by the h100-base profile. Every
ablation under runs/thesis/ inherits this contract and overrides exactly one
factor, so differences are attributable to that factor alone.

Choices made for feasibility ("no large runs"): a single short run per cell on
half the corpus, best-checkpoint selection on macro_f1 with early stopping, the
end-of-training uncertainty pass off, and masterlist pretraining off (pretraining
is evaluated on its own in thesis/pretraining.toml). Tune CODLLM_DATASET_SIZE and
CODLLM_NUM_TRAIN_EPOCHS to your budget; raise to 1.0 / longer for final numbers. 
All other augmentation knobs are pinned to the final-method values so each ablation
varies one factor from the chosen baseline.
"""

SUBMITTED = false

base = "../profiles/h100-base.toml"
force_reprocess = false

[env]
CODLLM_LR = 2.5e-5
CODLLM_DATASET_SIZE = 1
CODLLM_TRAIN_SIZE = 0.9
CODLLM_VAL_SIZE = 0.05
CODLLM_TEST_SIZE = 0.05
CODLLM_NUM_TRAIN_EPOCHS = 8

# Epoch-cadence eval, best-checkpoint selection on macro_f1, early stopping.
CODLLM_EVAL_STRATEGY = "epoch"
CODLLM_SAVE_STRATEGY = "best"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"
CODLLM_SAVE_TOTAL_LIMIT = 1
CODLLM_LOAD_BEST_MODEL_AT_END = 1
CODLLM_EARLY_STOPPING_PATIENCE = 4
CODLLM_EARLY_STOPPING_THRESHOLD = 0.0

# Task: multi-CoD (final method), no synthetic inflation.
CODLLM_MAX_LABEL_COUNT = 3
CODLLM_MULTICOD_SHUFFLE_LABELS = 1
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0

# Augmentation: the final-method contract. Ablations override one of these rows.
CODLLM_BALANCE_STRATEGY = "floor"
CODLLM_BALANCE_FLOOR = 50
CODLLM_BALANCE_FLOOR_DECAY = 0.0
CODLLM_BALANCE_FLOOR_SINGLECOD_ONLY = 1
CODLLM_BALANCE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATION_RATE = 0.5
CODLLM_BASE_PERTURBATION_MEAN = 0.10
CODLLM_BASE_PERTURBATION_VARIANCE = 0.05

# Pretraining off for the ablation suite (CODLLM_PRETRAIN_ENABLED defaults to false);
# evaluated separately in thesis/pretraining.toml.

# Skip the end-of-training uncertainty pass on ablations to save time.
CODLLM_UNCERTAINTY_EVAL = false
