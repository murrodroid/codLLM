name = "thesis_model_size"
command = "train"
description = """
Tests (scaling): how does coding quality change with model capacity? Runs the full
thesis method across the four FLAN-T5 sizes as lockstep variants, with the effective
batch held at 256 across sizes (per-device x accumulation) so size is the only
variable. This is the one experiment that deliberately varies the model and the only
one that touches the large/xl checkpoints, so it is the heaviest run; the full-budget
80-epoch version lives in runs/single/size_sweep_*.toml.

NOTE: unlike the other thesis specs, this one does NOT inherit base_thesis, because
base_thesis fixes the model to flan-t5-base and that would override the per-size
variants. The shared contract is therefore repeated here.
"""

SUBMITTED = false


force_reprocess = false

[env]
CODLLM_LR = 2.5e-5
CODLLM_DATASET_SIZE = 0.5
CODLLM_TRAIN_SIZE = 0.9
CODLLM_VAL_SIZE = 0.05
CODLLM_TEST_SIZE = 0.05
CODLLM_NUM_TRAIN_EPOCHS = 15
CODLLM_EVAL_STRATEGY = "epoch"
CODLLM_SAVE_STRATEGY = "best"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"
CODLLM_SAVE_TOTAL_LIMIT = 1
CODLLM_LOAD_BEST_MODEL_AT_END = 1
CODLLM_EARLY_STOPPING_PATIENCE = 4
CODLLM_EARLY_STOPPING_THRESHOLD = 0.0
CODLLM_MAX_LABEL_COUNT = 3
CODLLM_MULTICOD_SHUFFLE_LABELS = 1
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0
CODLLM_BALANCE_STRATEGY = "floor"
CODLLM_BALANCE_FLOOR = 50
CODLLM_BALANCE_FLOOR_DECAY = 0.0
CODLLM_BALANCE_FLOOR_SINGLECOD_ONLY = 1
CODLLM_BALANCE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATION_RATE = 0.5
CODLLM_BASE_PERTURBATION_MEAN = 0.10
CODLLM_BASE_PERTURBATION_VARIANCE = 0.05
CODLLM_UNCERTAINTY_EVAL = false

[[variants]]
name = "small"
base = "../profiles/h100-small.toml"
env = { CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 256, CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 256, CODLLM_GRADIENT_ACCUMULATION_STEPS = 1 }

[[variants]]
name = "base"
base = "../profiles/h100-base.toml"
env = { CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 128, CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 128, CODLLM_GRADIENT_ACCUMULATION_STEPS = 2 }

[[variants]]
name = "large"
base = "../profiles/h100-large.toml"
env = { CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 64, CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 64, CODLLM_GRADIENT_ACCUMULATION_STEPS = 4 }

[[variants]]
name = "xl"
base = "../profiles/h100-xl.toml"
env = { CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 16, CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 16, CODLLM_GRADIENT_ACCUMULATION_STEPS = 16 }
