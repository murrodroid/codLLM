base = "size_sweep_base_final.toml"
name = "base_holdout_ipswich"
description = """
RQ3 leave-one-source-out, OPTIMAL deployment config (inherits size_sweep_base_final.toml:
floor 200, multicod 0.3, constant_with_warmup, masterlist pretraining, 80ep / patience 10).
Holds out IPSWICH (English, ~2k). Trains on the other 4 historical sources; validation
excludes Ipswich automatically (_partition_hold_out_dataset removes it before the train/val
split); transfer is evaluated on Ipswich. Isolated output dir so AUTO_RESUME stays per-run.
"""
force_reprocess = false

[env]
CODLLM_HOLD_OUT_DATASET = "ipswich_1871_1911"
CODLLM_HOLD_OUT_EVALUATE_PER = "epoch"
CODLLM_HOLD_OUT_EVALUATE_RATIO = 0.10
CODLLM_OUTPUT_DIR = "runs_holdout_ipswich_fixed"
CODLLM_DATALOADER_PERSISTENT_WORKERS = false
CODLLM_SAVE_TOTAL_LIMIT = 10
CODLLM_AUTO_RESUME = true
CODLLM_UNCERTAINTY_EVAL = false

# Eval-only speedup: larger validation batch (train stays 128) uses fine-tune VRAM
# headroom to cut per-epoch generation passes. 160 worst-case ~73GB of 80GB (Ipswich runs
# hotter than Belgium, so a smaller bump). No effect on training, the resume, or the run id.
CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 160
