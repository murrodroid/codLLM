base = "../profiles/h100-base.toml"
name = "size_sweep_base_final"
description = """
Final flan-t5-base DEPLOYMENT run for the thesis. Standalone (NOT part of the
size sweep), so it adopts the best values found in the 8-epoch one-factor
ablations rather than the size-sweep contract:
  * upsampling floor   50 -> 200   (best in the floor sweep)
  * multicod synthetic 0  -> 0.3   (best in the multicod sweep)
  * LR scheduler       cosine -> constant_with_warmup (best in the scheduler sweep)
Pretraining ON, 80 epochs / patience 10, base perturbation rate kept at 0.5 as a
robustness hedge for unseen sources (rate 0 was best on in-distribution val, but
0.5 trades a little val macro-F1 for unseen-string robustness). These ablations
tune one factor at a time holding the rest fixed, so the combination is the best
we found, not a guaranteed joint optimum.

Output is routed to a dedicated, isolated root under the selected user's
RUN_STORAGE_DIR (CODLLM_OUTPUT_DIR below) with
CODLLM_PER_SIZE_OUTPUT_DIR = 0 so AUTO_RESUME cannot pick up the earlier
floor-200-only run at runs_base_floor200/run-28689905 (killed). Within this new
root, AUTO_RESUME still works across HPC slots (~50h over 2-3 24h slots).
"""
force_reprocess = false

[env]
CODLLM_DATASET_SIZE = 1.0
CODLLM_LR = 2.5e-5
CODLLM_NUM_TRAIN_EPOCHS = 80

# Effective batch size 256 = 128 * 2.
CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 128
CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 128
CODLLM_GRADIENT_ACCUMULATION_STEPS = 2

CODLLM_MAX_LABEL_COUNT = 3
CODLLM_MULTICOD_SHUFFLE_LABELS = 1
CODLLM_MULTICOD_SYNTHETIC_TEXT_SEPARATOR = ", "
# Best in the multicod sweep (was 0 in the size sweep).
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0.3

CODLLM_SAVE_STRATEGY = "epoch"
CODLLM_SAVE_TOTAL_LIMIT = 3
CODLLM_EVAL_STRATEGY = "epoch"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"
CODLLM_LOAD_BEST_MODEL_AT_END = 1
CODLLM_EARLY_STOPPING_PATIENCE = 10
CODLLM_EARLY_STOPPING_THRESHOLD = 0.0

# Best in the scheduler sweep (was cosine in the size sweep). Warmup ratio stays
# at the base-contract default that the ablation used.
CODLLM_LR_SCHEDULER_TYPE = "constant_with_warmup"

CODLLM_AUTO_RESUME = 1
# Fresh isolated output root so AUTO_RESUME cannot resume the killed floor-200 run.
CODLLM_OUTPUT_DIR = "runs_base_final"
CODLLM_PER_SIZE_OUTPUT_DIR = 0
CODLLM_MAX_RUNTIME_SECONDS = 82800
CODLLM_RUNTIME_SAFETY_MARGIN_SECONDS = 600

CODLLM_BALANCE_STRATEGY = "floor"
# Best in the floor sweep (was 50 in the size sweep).
CODLLM_BALANCE_FLOOR = 200
CODLLM_BALANCE_FLOOR_DECAY = 0.0
CODLLM_BALANCE_FLOOR_SINGLECOD_ONLY = 1
CODLLM_BALANCE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
# Kept at 0.5 as a robustness hedge (rate 0 best on in-distribution val).
CODLLM_BASE_PERTURBATION_RATE = 0.5
CODLLM_BASE_PERTURBATION_MEAN = 0.10
CODLLM_BASE_PERTURBATION_VARIANCE = 0.05

CODLLM_PRETRAIN_ENABLED = true
CODLLM_PRETRAIN_LEARNING_RATE = 1e-5
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 16
CODLLM_PRETRAIN_WARMUP_RATIO = 0.5
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "constant"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 4
CODLLM_PRETRAIN_UPSAMPLE_ENABLED = true
CODLLM_PRETRAIN_UPSAMPLE_TARGET_PER_LABEL = 8
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS_PER_SAMPLE = 6
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_TEXT_SEPARATOR = ", "
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_RATIO = 0.15
