base = "../base/h100-large.toml"
name = "t5-large-h100"
description = "Primary H100 sequence-classification run with masterlist pretraining and label harmonization."

[env]
CODLLM_MODEL_TASK = "sequence_classification"
CODLLM_LR = 2.5e-5
CODLLM_DATASET_SIZE = 1.0
CODLLM_NUM_TRAIN_EPOCHS = 32
CODLLM_SAVE_STRATEGY = "best"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"
CODLLM_BALANCE_STRATEGY = "upsample"
CODLLM_BALANCE_TARGET_QUANTILE = 0.5
CODLLM_BALANCE_UPSAMPLE_INVERSE_POWER = 0.5
CODLLM_BALANCE_UPSAMPLE_BUDGET_RATIO = 0.5
CODLLM_WEIGHT_DECAY = 0.0
CODLLM_WARMUP_RATIO = 0.05
CODLLM_TRAINING_INPUT = "cod"
CODLLM_TRAIN_SIZE = 0.98
CODLLM_VAL_SIZE = 0.01
CODLLM_TEST_SIZE = 0.01
CODLLM_PRETRAIN_ENABLED = true
CODLLM_LABEL_HARMONIZATION_ENABLED = true
CODLLM_PRETRAIN_TRANSFER_SHEET_NAME = "2020to2024transfer"
CODLLM_PRETRAIN_MASTERLIST_PATH = "data/raw/ICD10h_Masterlist_2024.xlsx"
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 50
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "linear"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 10
