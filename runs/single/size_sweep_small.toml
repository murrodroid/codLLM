base = "../profiles/h100-small.toml"
name = "size_sweep_small"
description = """
Size-sweep baseline for flan-t5-small. Identical multi-CoD setup, splits,
and metric reporting across small/base/large/xl so the four runs are
directly comparable on the W&B 'Compare runs' view.

Pairs with --auto-resume + --per-size-output-dir on the LSF launcher so
24h-killed jobs resume into the same W&B run on the next slot.
"""
force_reprocess = false

[env]
CODLLM_DATASET_SIZE = 1.0
CODLLM_LR = 2.5e-5
CODLLM_NUM_TRAIN_EPOCHS = 80

# Effective batch size = 256 across all four sizes (small/base/large/xl)
# matches the proven base_small baseline that finished 80 epochs in 23h.
CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 256
CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 256
CODLLM_GRADIENT_ACCUMULATION_STEPS = 1

# Multi-CoD task definition (matches existing multicod sweep convention).
CODLLM_MAX_LABEL_COUNT = 3
CODLLM_MULTICOD_SHUFFLE_LABELS = 1
CODLLM_MULTICOD_SYNTHETIC_TEXT_SEPARATOR = ", "
# Synthesis OFF: with floor-50 upsampling running AFTER multi-CoD synthesis,
# every unique synthetic compound label (count=1) was getting upsampled to 50,
# inflating training to ~8.8M rows and shifting the label-count distribution
# from val/test's 95% single-label to train's 88% multi-label. Real multi-CoD
# rows still flow through shuffle_multicod_label_order, so genuine compound
# records are preserved.
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0

# Step-cadence saves so a 24h kill loses at most one save_steps interval.
CODLLM_SAVE_STRATEGY = "steps"
CODLLM_SAVE_STEPS = 2000
CODLLM_SAVE_TOTAL_LIMIT = 3
CODLLM_EVAL_STRATEGY = "steps"
CODLLM_EVAL_STEPS = 2000
CODLLM_SAVE_STRATEGY_BEST_METRIC = "sample_f1"
CODLLM_LOAD_BEST_MODEL_AT_END = 1
CODLLM_EARLY_STOPPING_PATIENCE = 8
CODLLM_EARLY_STOPPING_THRESHOLD = 0.0

# HPC resilience (24h slot, save+stop ~10min before SIGKILL).
CODLLM_AUTO_RESUME = 1
CODLLM_PER_SIZE_OUTPUT_DIR = 1
CODLLM_MAX_RUNTIME_SECONDS = 82800
CODLLM_RUNTIME_SAFETY_MARGIN_SECONDS = 600

# Balance + perturbation policy from the small-model baseline.
CODLLM_BALANCE_STRATEGY = "floor"
CODLLM_BALANCE_FLOOR = 50
CODLLM_BALANCE_FLOOR_DECAY = 0.0
CODLLM_BALANCE_FLOOR_SINGLECOD_ONLY = 1
CODLLM_BALANCE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
CODLLM_BASE_PERTURBATION_RATE = 0.5
CODLLM_BASE_PERTURBATION_MEAN = 0.10
CODLLM_BASE_PERTURBATION_VARIANCE = 0.05

# Pretraining on the masterlist (matches base_small baseline).
CODLLM_PRETRAIN_ENABLED = true
CODLLM_PRETRAIN_LEARNING_RATE = 1e-5
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 16
CODLLM_PRETRAIN_WARMUP_RATIO = 0.5
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "constant"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 4
CODLLM_PRETRAIN_UPSAMPLE_ENABLED = true
CODLLM_PRETRAIN_UPSAMPLE_TARGET_PER_LABEL = 8
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS_PER_SAMPLE = 6
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_TEXT_SEPARATOR = ", "
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_RATIO = 0.15
