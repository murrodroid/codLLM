name = "thesis_masterlist_injection"
command = "train"
description = """
Tests: does injecting masterlist code-description rows directly into the fine-tuning
set (separate from pretraining) improve coverage of rare and zero-shot codes? Compares
injection off against 10 and 20 copies per label. Confirms or refutes masterlist
injection as a fine-tuning-time augmentation.

The cells are [[variants]] rather than a [sweep] because target-per-label = 0 with
injection enabled is NOT a no-op: DataHandler._inject_masterlist raises ValueError for
targets below 1, so the off cell must disable injection instead.
"""

SUBMITTED = false

base = "base_thesis.toml"
force_reprocess = false

[[variants]]
name = "off"
env = { CODLLM_MASTERLIST_INJECT_ENABLED = 0 }

[[variants]]
name = "inject-10"
env = { CODLLM_MASTERLIST_INJECT_ENABLED = 1, CODLLM_MASTERLIST_INJECT_TARGET_PER_LABEL = 10 }

[[variants]]
name = "inject-20"
env = { CODLLM_MASTERLIST_INJECT_ENABLED = 1, CODLLM_MASTERLIST_INJECT_TARGET_PER_LABEL = 20 }
