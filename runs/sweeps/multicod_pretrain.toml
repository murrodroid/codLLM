base = "../profiles/h100-small.toml"
name = "multicod_pretraining"
description = "Sweep synthetic multi-COD masterlist pretraining for multi-COD fine-tuning."
force_reprocess = false

[env]
CODLLM_TRAINING_INPUT = "cod"
CODLLM_LR = 2.5e-5
CODLLM_DATASET_SIZE = 0.5
CODLLM_NUM_TRAIN_EPOCHS = 32
CODLLM_MAX_LABEL_COUNT = 3
CODLLM_SAVE_STRATEGY = "no"
CODLLM_MULTICOD_SHUFFLE_LABELS = true

CODLLM_PRETRAIN_LEARNING_RATE = 1e-5
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 16
CODLLM_PRETRAIN_WARMUP_RATIO = 0.5
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "constant"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 4
CODLLM_PRETRAIN_UPSAMPLE_ENABLED = true
CODLLM_PRETRAIN_UPSAMPLE_TARGET_PER_LABEL = 8
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS_PER_SAMPLE = 6
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_TEXT_SEPARATORS = '[", ", " & ", " ", "; ", " / "]'
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_RATIO = 0.15


[sweep]
CODLLM_PRETRAIN_ENABLED = [true,false]
