name = "thesis_input_features"
command = "train"
description = """
Tests (RQ3, per-example input representation): does adding structured metadata to the
input help? Sweeps the input between cause-text only ("cod") and
cause-text + age + sex ("cod,age,sex") at the thesis baseline. Confirms or refutes that
demographic metadata improves classification.
"""

SUBMITTED = true

base = "base_thesis.toml"
force_reprocess = false

[sweep]
CODLLM_TRAINING_INPUT = ["cod", "cod,age,sex"]
