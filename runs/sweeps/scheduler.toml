base = "../base/h100-large.toml"
name = "multicod"
description = "Sweep seq2seq fine-tuning input features while holding the training setup fixed."
force_reprocess = false

[env]
CODLLM_LR = 2.5e-5
CODLLM_NUM_TRAIN_EPOCHS = 8
CODLLM_SAVE_STRATEGY = "no"

[sweep]
CODLLM_LR_SCHEDULER_TYPE = ["cosine","linear","constant_with_warmup"]
