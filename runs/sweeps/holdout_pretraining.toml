name = "thesis_holdout_pretraining"
command = "train"
description = """
Tests (generalisation x pretraining): does masterlist pretraining improve transfer to
an unseen source? Identical to thesis/holdout.toml (same leave-one-source-out cells,
same fine-tuning contract, historic strings excluded from training) but with masterlist
pretraining enabled, so each cell here is read against the matching thesis_holdout cell.
The pretraining-stage hyperparameters are inherited from runs/sweeps/pretraining.toml,
the same file thesis/pretraining.toml inherits, so the pretraining stage is identical
across both experiments.

The [sweep] below pins CODLLM_PRETRAIN_ENABLED to [true]: the inherited sweep axis is
[true, false], and the false cells would just duplicate thesis_holdout. Like
thesis_holdout, this is a heavy experiment (one pretrain + retrain per source).
"""

SUBMITTED = true


base = [
  "holdout.toml",
  "pretraining.toml",
]
force_reprocess = false

[sweep]
CODLLM_PRETRAIN_ENABLED = [true]
CODLLM_HOLD_OUT_DATASET = [
  "amsterdam_1854_1926",
  "copenhagen_may2025",
  "madrid_1905_1927",
  "belgium_1920_1930",
  "ipswich_1871_1911",
]
