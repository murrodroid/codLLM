base = "../base/h100-large.toml"
name = "pretraining"
description = "Sweep masterlist pretraining duration while holding the fine-tuning setup fixed."
force_reprocess = false

[env]
CODLLM_TRAINING_INPUT = "cod"
CODLLM_MODEL_TASK = "seq2seq"
CODLLM_LR = 2.5e-5
CODLLM_DATASET_SIZE = 0.5
CODLLM_NUM_TRAIN_EPOCHS = 4
CODLLM_SAVE_STRATEGY = "no"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"
CODLLM_BALANCE_STRATEGY = "none"
CODLLM_BALANCE_TARGET_QUANTILE = 0.5
CODLLM_BALANCE_UPSAMPLE_INVERSE_POWER = 0.5
CODLLM_BALANCE_UPSAMPLE_BUDGET_RATIO = 0.5
CODLLM_WEIGHT_DECAY = 0.0
CODLLM_MAX_GRAD_NORM = 0.5
CODLLM_WARMUP_RATIO = 0.1
CODLLM_LR_SCHEDULER_TYPE = "linear"
CODLLM_PRETRAIN_LEARNING_RATE = 2.5e-6
CODLLM_LABEL_HARMONIZATION_ENABLED = true
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "constant"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 10
CODLLM_PRETRAIN_UPSAMPLE_ENABLED = true
CODLLM_PRETRAIN_UPSAMPLE_TARGET_PER_LABEL = 15
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS = [
  "swap_adjacent_chars",
  "delete_random_char",
  "accent_random_vowel",
  "qwerty_misspell",
]
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS_PER_SAMPLE = 3
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 5


[sweep]
CODLLM_PRETRAIN_ENABLED = [true,false]
