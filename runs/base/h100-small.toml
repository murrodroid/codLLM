name = "h100-small-base"
command = "train"
description = "H100 runtime setup for flan-t5-small training through invoke-generated LSF jobs."
force_reprocess = false

[env]
CODLLM_HF_MODEL = "google/flan-t5-small"
CODLLM_MAX_SOURCE_LENGTH = 256
CODLLM_MAX_TARGET_LENGTH = 32
CODLLM_DATALOADER_NUM_WORKERS = 4
CODLLM_DATALOADER_PIN_MEMORY = true
CODLLM_DATALOADER_PERSISTENT_WORKERS = false
CODLLM_DATALOADER_PREFETCH_FACTOR = 1
CODLLM_PER_DEVICE_TRAIN_BATCH_SIZE = 64
CODLLM_PER_DEVICE_EVAL_BATCH_SIZE = 64
CODLLM_GRADIENT_ACCUMULATION_STEPS = 1
CODLLM_TORCH_DTYPE = "bfloat16"
CODLLM_LOGGING_STEPS = 25
CODLLM_EVAL_STRATEGY = "epoch"
CODLLM_VERBOSE = true
CODLLM_DETERMINISTIC_ALGORITHMS = false
CODLLM_CUDNN_DETERMINISTIC = false
CODLLM_CUDNN_BENCHMARK = true
