base = "../profiles/h100-base.toml"
name = "codllm_base"
description = "simple run to check baseline model performance"
force_reprocess = false

[env]
# Checkpoint output root. A relative path resolves under the per-user storage
# folder ($RUN_STORAGE_DIR, e.g. /work3/<account>/codllm) on the compute node,
# so checkpoints land at .../codllm/checkpoints/codllm_base/run-*/checkpoint-*.
# Isolated + resume-stable so auto-resume always continues *this* run.
CODLLM_OUTPUT_DIR = "checkpoints/codllm_base"
CODLLM_AUTO_RESUME = 1
# Per-slot save buffer: stop this many seconds before the slot wall limit.
CODLLM_RUNTIME_SAFETY_MARGIN_SECONDS = 600
# The per-slot time budget and resubmission count are set at submit time from
# the LSF profile's wall time via `invoke hpc.submit --duration <e.g. 2w>`,
# so they are intentionally not hardcoded here.

# Log the full metric suite and the full run config to W&B.
CODLLM_WANDB_METRIC_MODE = "all"
CODLLM_WANDB_RUN_CONFIG_MODE = "full"

CODLLM_TRAINING_INPUT = "cod,age,sex"
CODLLM_DATASET_SIZE = 1.0
CODLLM_LR = 2.5e-5
CODLLM_NUM_TRAIN_EPOCHS = 120
CODLLM_SAVE_STRATEGY = "best"
CODLLM_SAVE_STRATEGY_BEST_METRIC = "macro_f1"

CODLLM_LABEL_STANDARDIZATION_ENABLED = true

CODLLM_MAX_LABEL_COUNT = 5
CODLLM_MULTICOD_SHUFFLE_LABELS = 1
CODLLM_MULTICOD_SYNTHETIC_RATIO = 0.5

CODLLM_BALANCE_STRATEGY = "floor"
CODLLM_BALANCE_FLOOR = 300
CODLLM_BALANCE_FLOOR_SINGLECOD_ONLY = 1

CODLLM_BASE_PERTURBATION_RATE = 0.5
CODLLM_BASE_PERTURBATION_MEAN = 0.10
CODLLM_BASE_PERTURBATION_VARIANCE = 0.05

CODLLM_PRETRAIN_ENABLED = true
CODLLM_PRETRAIN_LEARNING_RATE = 1e-5
CODLLM_PRETRAIN_NUM_TRAIN_EPOCHS = 32
CODLLM_PRETRAIN_WARMUP_RATIO = 0.5
CODLLM_PRETRAIN_LR_SCHEDULER_TYPE = "constant"
CODLLM_PRETRAIN_EVAL_EVERY_N_EPOCHS = 8
CODLLM_PRETRAIN_UPSAMPLE_ENABLED = true
CODLLM_PRETRAIN_UPSAMPLE_TARGET_PER_LABEL = 12
CODLLM_PRETRAIN_UPSAMPLE_PERTURBATIONS_PER_SAMPLE = 3
CODLLM_PRETRAIN_MULTICOD_SYNTHETIC_RATIO = 0.5

CODLLM_EARLY_STOPPING_PATIENCE = 10
# Potential final-run settings; left inactive until explicitly chosen.
# CODLLM_SAVE_TOTAL_LIMIT = 3
# CODLLM_LOAD_BEST_MODEL_AT_END = 1
# CODLLM_EARLY_STOPPING_THRESHOLD = 0.0
# CODLLM_BALANCE_PERTURBATIONS = "swap_adjacent_chars,delete_random_char,accent_random_vowel,qwerty_misspell"
# CODLLM_BALANCE_PERTURBATION_MEAN = 0.05
# CODLLM_BALANCE_PERTURBATION_VARIANCE = 0.0
# CODLLM_BALANCE_PERTURBATION_LOFT = 3.0
